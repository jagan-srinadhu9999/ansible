  
  - name: install curl and ngnix and check status 
    hosts: web
    gather_facts: false
    become: true
    tasks:
      - name: Install curl package
        ansible.builtin.package:
          name: curl
          state: present

      - name: Verify curl installation
        ansible.builtin.command: curl --version
        register: curl_version
        changed_when: false

      - name: install ngnix
        ansible.builtin.package:
          name: nginx
          state: present  

      - name: start nginx service
        ansible.builtin.service:
          name: nginx
          state: started
          enabled: true
      - name: ensure ngnix is running
        ansible.builtin.systemd_service:
            name: nginx
            enabled: yes
            state: started

     
        
      - name: Fetch public IP using ipify API
        community.general.ipify_facts:
            # This task runs directly on the remote node machine
            register: ipify_result

      - name: Output the Public IP
        ansible.builtin.debug:
           msg: "The public IP of this remote EC2 node is {{ ansible_facts.ipify_public_ip }}"
